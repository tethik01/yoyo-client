# MCP servers Yoyo mounts as a client.
#
# Each entry becomes a set of tools in Yoyo's registry, named "<prefix>_<remote tool>".
# Tools appear to the agent exactly like built-ins — nothing above the registry knows the
# difference.
#
#   yoyo mcp list        show configured servers and their tools
#   yoyo tools           the full registry, built-ins plus mounted
#
# Failure to mount one server does not prevent the others from mounting.

servers:
  # First-party: the Obsidian vault. Read anywhere in the vault, write only to drafts.
  # Set YOYO_VAULT_PATH in .env, then flip enabled to true.
  vault:
    command: python
    args: ["-m", "yoyo.mcp.vault_server"]
    enabled: true          # live 2026-08-15 against C:\Projects\Yoyo\Notes
    prefix: vault

  # Tasks: the vault's checkbox items as structured, filterable data. Read-only —
  # Yoyo does not tick your boxes. Needs YOYO_VAULT_PATH, same as the vault server.
  tasks:
    command: python
    args: ["-m", "yoyo.mcp.tasks_server"]
    enabled: true          # reads the same vault
    prefix: tasks

  # Calendar: Google Calendar and Microsoft 365, read-only. Shares the OAuth app
  # registration with mail — configure accounts in yoyo-calendar.yaml and run
  # `yoyo calendar auth <name>` before enabling.
  calendar:
    command: python
    args: ["-m", "yoyo.mcp.calendar_server"]
    enabled: true          # read-only; no create/update/delete/RSVP tool exists
    prefix: cal

  # Web search + fetch, via your own SearXNG. THE ONLY SERVER THAT SENDS DATA OUT and
  # the only one that brings UNTRUSTED text back. Needs SearXNG's JSON API enabled.
  search:
    command: python
    args: ["-m", "yoyo.mcp.search_server"]
    enabled: true          # live 2026-08-15 against the owner's SearXNG on :8888
    prefix: web

  # Mail: Gmail and Microsoft 365, read + draft only. Configure accounts in
  # yoyo-mail.yaml and authenticate with `yoyo mail auth <name>` before enabling.
  mail:
    command: python
    args: ["-m", "yoyo.mcp.mail_server"]
    enabled: true          # personal Gmail live 2026-08-15. Read + draft only, no send.
    prefix: mail

  # Off-the-shelf, third-party: the reference filesystem server. Needs Node (npx).
  #
  # ┌─ READ-ONLY BY ALLOWLIST, DELIBERATELY ──────────────────────────────────────┐
  # │ This server ALSO ships write_file, edit_file, move_file and                  │
  # │ create_directory. Mounting it whole would give an agent write access to      │
  # │ everything under the paths below — including Yoyo's own source — and void    │
  # │ the rule that Yoyo proposes and a human disposes.                            │
  # │                                                                              │
  # │ `allow` lists the ONLY tools that get registered. The model never learns the │
  # │ write tools exist, which is stronger than telling it not to call them.       │
  # │ Widen this list only with a reason you would write down.                     │
  # └──────────────────────────────────────────────────────────────────────────────┘
  #
  # The trailing paths are the roots it may read. Scope them narrowly: everything
  # reachable from here can end up in a model's context.
  files:
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "C:/Projects/Yoyo/Notes"
    enabled: true
    prefix: fs
    allow:
      - read_text_file
      - read_file
      - list_directory
      - directory_tree
      - search_files
      - get_file_info
      - list_allowed_directories
