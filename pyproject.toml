[project]
name = "yoyo-client"
version = "0.1.0"
description = "Yoyo — local assistant stack. Inference lives on MyAIServer; everything else runs here."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.40",
    # Must track the server image in docker-compose.yml. The client warns loudly
    # on a major/minor gap and the wire format is not guaranteed across one.
    "qdrant-client>=1.12,<1.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    # 1.x exposes FastMCP, 2.x exposes MCPServer — mcp/_compat.py handles both.
    "mcp>=1.2",
    "langgraph>=0.2",
]

[project.optional-dependencies]
ingest = [
    "docling>=2.0",
]
local-embed = [
    "fastembed>=0.4",
]
mail = [
    # Gmail: installed-app OAuth. Microsoft: MSAL device-code flow.
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "msal>=1.28",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
yoyo = "yoyo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoyo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: spawns a subprocess or hits the network"]
